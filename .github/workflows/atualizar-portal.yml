name: Atualizar Lupa Maricá (2x ao dia)

on:
  workflow_dispatch:
  schedule:
    # 07:30 horário de Brasília (10:30 UTC) — atualização da manhã
    - cron: '30 10 * * *'
    # 17:30 horário de Brasília (20:30 UTC) — atualização da tarde
    - cron: '30 20 * * *'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: atualizar-lupa-marica
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.commit.outputs.mudou }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: Designer-Eleitoral

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install pandas

      - name: Coletar notícias e verificar fontes oficiais
        run: python3 coleta/coletar_auto.py

      - name: Reconstruir dados do portal e sitemap
        run: python3 -I coleta/build_dados.py

      - name: Porta de qualidade obrigatória
        run: python3 -I coleta/qualidade.py

      - name: Alertar dados defasados ou fonte fora do ar
        id: alerta
        run: python3 -I coleta/alerta_defasagem.py

      - name: Abrir Issue de aviso (uma por dia, sem duplicar)
        if: steps.alerta.outputs.alerta == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO="Alerta automático: dados defasados ou fonte fora do ar"
          EXISTE=$(gh issue list --state open --search "\"$TITULO\" in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTE" ]; then
            gh issue comment "$EXISTE" --body-file alerta.md
          else
            gh issue create --title "$TITULO" --body-file alerta.md
          fi
          rm -f alerta.md

      - name: Checar fila de moderação do Cidadão Fiscalizador (quando Supabase estiver ativo)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            python3 - <<'PY'
          import json, os, urllib.request
          url = os.environ['SUPABASE_URL'].rstrip('/') + '/rest/v1/relatos?status=eq.pendente&select=id'
          req = urllib.request.Request(url, headers={
              'apikey': os.environ['SUPABASE_SERVICE_KEY'],
              'Authorization': 'Bearer ' + os.environ['SUPABASE_SERVICE_KEY'],
          })
          with urllib.request.urlopen(req, timeout=15) as r:
              rows = json.loads(r.read().decode('utf-8'))
          print(f'Relatos pendentes de moderação no Cidadão Fiscalizador: {len(rows)}')
          PY
          else
            echo "Supabase ainda não configurado nos Secrets — pulando checagem de relatos pendentes."
          fi

      - name: Gravar alterações no repositório
        id: commit
        run: |
          git config user.name "Lupa Maricá Bot"
          git config user.email "bot@lupamarica.com"
          git add dados/consolidado/noticias.json dados/consolidado/status_automacao.json site/dados.js site/sitemap.xml
          if git diff --cached --quiet; then
            echo "Sem alterações novas nesta verificação."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            DATA_BRT=$(TZ="America/Sao_Paulo" date +"%Y-%m-%d %H:%M BRT")
            git commit -m "chore(auto): atualização automática Lupa Maricá ($DATA_BRT)"
            git push origin HEAD:Designer-Eleitoral
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar pacote do site para publicação
        if: steps.commit.outputs.mudou == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: atualizar
    if: needs.atualizar.outputs.mudou == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar em lupamarica.com
        id: deploy
        uses: actions/deploy-pages@v4
