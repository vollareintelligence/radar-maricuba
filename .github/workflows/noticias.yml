name: Coletar notícias (Radar)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Designer-Eleitoral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar notícias
        run: python3 coleta/buscar_noticias.py
      - name: Gravar se mudou
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add dados/consolidado/noticias.json
          if git diff --cached --quiet; then echo "sem mudança"; else
            git commit -m "Atualiza notícias coletadas" && git push
          fi
